name: VimdowManager
options:
  minimumXcodeGenVersion: "2.46.0"
  projectFormat: xcode15_0
  settingPresets: none
  defaultConfig: Release
  developmentLanguage: en
  useBaseInternationalization: false
  deploymentTarget:
    macOS: "12.4"
configs:
  Debug: debug
  Release: release
settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    ARCHS: $(ARCHS_STANDARD_64_BIT)
    CLANG_CXX_LANGUAGE_STANDARD: gnu++0x
    CLANG_CXX_LIBRARY: libc++
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    GCC_C_LANGUAGE_STANDARD: gnu99
    GCC_ENABLE_OBJC_EXCEPTIONS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    SDKROOT: macosx
  configs:
    Debug:
      COPY_PHASE_STRIP: NO
      GCC_DYNAMIC_NO_PIC: NO
      GCC_OPTIMIZATION_LEVEL: 0
      GCC_PREPROCESSOR_DEFINITIONS:
        - DEBUG=1
        - $(inherited)
      GCC_SYMBOLS_PRIVATE_EXTERN: NO
      ONLY_ACTIVE_ARCH: YES
    Release:
      COPY_PHASE_STRIP: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
targets:
  VimdowManager:
    type: application
    platform: macOS
    sources:
      - path: VimdowManager
      - path: launcher.icns
        buildPhase: resources
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES
        GCC_PRECOMPILE_PREFIX_HEADER: YES
        GCC_PREFIX_HEADER: VimdowManager/VimdowManager-Prefix.pch
        INFOPLIST_FILE: VimdowManager/VimdowManager-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: rath.toys.VimdowManager
        PRODUCT_NAME: $(TARGET_NAME)
        PROVISIONING_PROFILE_SPECIFIER: ""
        WRAPPER_EXTENSION: app
    dependencies:
      - sdk: Cocoa.framework
      - sdk: Quartz.framework
      - sdk: Carbon.framework
      - sdk: CoreServices.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
schemes:
  VimdowManager:
    build:
      targets:
        VimdowManager: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
