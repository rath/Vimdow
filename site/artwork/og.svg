<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Social preview, drawn as the site's Vim help buffer in light mode.
       Text in Iosevka is outlined by scripts/outline-svg-text.py before rendering;
       the CJK tab labels use system fonts. -->
  <defs>
    <pattern id="rule" x="96" y="410" width="13" height="10" patternUnits="userSpaceOnUse">
      <rect x="1.5" y="0" width="10" height="3" fill="#177A42"/>
      <rect x="1.5" y="7" width="10" height="3" fill="#177A42"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Tab line -->
  <rect width="1200" height="52" fill="#13161C"/>
  <image x="22" y="12" width="28" height="28" xlink:href="favicon.svg"/>
  <text x="62" y="34" font-family="Iosevka" font-weight="700" font-size="22" fill="#FFFFFF">Vimdow</text>
  <rect x="160" y="0" width="100" height="52" fill="#FFFFFF"/>
  <text x="210" y="34" font-family="Iosevka" font-weight="700" font-size="22" text-anchor="middle" fill="#13161C">English</text>
  <g fill="#D5DAE0">
    <rect x="262" y="0" width="92" height="52"/>
    <rect x="356" y="0" width="92" height="52"/>
    <rect x="450" y="0" width="112" height="52"/>
  </g>
  <g font-size="21" text-anchor="middle" fill="#13161C">
    <text x="308" y="33" font-family="Apple SD Gothic Neo">한국어</text>
    <text x="402" y="33" font-family="Hiragino Sans">日本語</text>
    <text x="506" y="33" font-family="PingFang SC">简体中文</text>
  </g>
  <g fill="#13161C">
    <rect x="276" y="38" width="64" height="1.5"/>
    <rect x="370" y="38" width="64" height="1.5"/>
    <rect x="464" y="38" width="84" height="1.5"/>
  </g>
  <text x="1178" y="34" font-family="Iosevka" font-size="22" text-anchor="end" fill="#FFFFFF">GitHub</text>
  <rect x="1112" y="38" width="66" height="1.5" fill="#FFFFFF"/>

  <!-- Buffer -->
  <text x="96" y="124" font-family="Iosevka" font-size="26" fill="#177A42">*vimdow.txt*</text>
  <text x="1104" y="124" font-family="Iosevka" font-size="26" text-anchor="end" fill="#13161C">For macOS 14 and later</text>
  <g font-family="Iosevka" font-weight="700" font-size="100" fill="#13161C">
    <text x="92" y="250">Your windows, in</text>
    <text x="92" y="358">Vim's vocabulary.</text>
  </g>
  <rect x="96" y="410" width="1014" height="10" fill="url(#rule)"/>
  <text x="96" y="480" font-family="Iosevka" font-size="32" fill="#13161C">Vim-style window management for macOS</text>
  <g fill="none" stroke="#3D4552" stroke-width="2">
    <rect x="97" y="506" width="40" height="44" rx="4"/>
    <rect x="145" y="506" width="40" height="44" rx="4"/>
    <rect x="193" y="506" width="40" height="44" rx="4"/>
    <rect x="241" y="506" width="40" height="44" rx="4"/>
  </g>
  <g font-family="Iosevka" font-weight="700" font-size="28" text-anchor="middle" fill="#3D4552">
    <text x="117" y="537">h</text>
    <text x="165" y="537">j</text>
    <text x="213" y="537">k</text>
    <text x="261" y="537">l</text>
  </g>

  <!-- Status line -->
  <rect y="578" width="1200" height="52" fill="#13161C"/>
  <g font-family="Iosevka" font-weight="700" font-size="22" fill="#FFFFFF">
    <text x="22" y="611">vimdow.told.me [Help][RO]</text>
    <text x="1040" y="611" text-anchor="end">1,1</text>
    <text x="1178" y="611" text-anchor="end">Top</text>
  </g>
</svg>
